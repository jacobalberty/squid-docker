name: build

# Checks that the image builds on every pull request. No image is pushed;
# release.yml builds and publishes images on merge to main.
#
# Each platform builds on a native runner (no QEMU emulation, which makes the
# Squid compile very slow). Layers are cached in GHCR tags so more than the
# last run is reused: each pull request writes buildcache-pr-<N>-<arch> and
# reads that plus main's buildcache-<arch>, and release.yml reads the merged
# PR's cache. Pull requests from forks can read but not write;
# cache-cleanup.yml deletes a PR's tags when it closes.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Written by release.yml on main; every build reads it.
  CACHE_MAIN: ghcr.io/${{ github.repository }}:buildcache
  # This pull request's own cache, reused by each push to it and by the
  # release build after it merges. Empty number for manual runs, which only read.
  CACHE_PR: ghcr.io/${{ github.repository }}:buildcache-pr-${{ github.event.pull_request.number }}
  # False outside pull requests and for forks, whose token cannot write packages.
  CAN_WRITE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry
        if: env.CAN_WRITE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: |
            type=registry,ref=${{ env.CACHE_PR }}-${{ matrix.arch }}
            type=registry,ref=${{ env.CACHE_MAIN }}-${{ matrix.arch }}
          cache-to: ${{ env.CAN_WRITE == 'true' && format('type=registry,ref={0}-{1},mode=max,image-manifest=true,oci-mediatypes=true', env.CACHE_PR, matrix.arch) || '' }}
