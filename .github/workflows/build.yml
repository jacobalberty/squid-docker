name: build

# Checks that the image builds on every pull request. No image is pushed;
# release.yml builds and publishes images on merge to main. Layers are cached
# in a registry tag shared with release.yml, so the release build after a
# merge reuses what the pull request built. Pull requests from forks have no
# registry write access: they read the cache but do not update it.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  CACHE_REF: ghcr.io/${{ github.repository }}:buildcache
  # False for pull requests from forks, whose token cannot write packages.
  CAN_WRITE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry
        if: env.CAN_WRITE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: ${{ env.CAN_WRITE == 'true' && format('type=registry,ref={0},mode=max,image-manifest=true,oci-mediatypes=true', env.CACHE_REF) || '' }}
