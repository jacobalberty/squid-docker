name: build

# Checks that the image builds on every pull request. No image is pushed;
# release.yml builds and publishes images on merge to main.
#
# Layers are cached in GHCR tags so more than the last run is reused: each
# pull request writes buildcache-pr-<N> and reads that plus the main cache
# (buildcache), and release.yml reads the merged PR's cache. Pull requests
# from forks can read but not write; cache-cleanup.yml deletes a PR's tag
# when it closes.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Cache written by release.yml on main; every build reads it.
  CACHE_MAIN: ghcr.io/${{ github.repository }}:buildcache
  # This pull request's own cache, reused by each push to it and by the
  # release build after it merges. Empty for manual runs, which only read.
  CACHE_PR: ghcr.io/${{ github.repository }}:buildcache-pr-${{ github.event.pull_request.number }}
  # False outside pull requests and for forks, whose token cannot write packages.
  CAN_WRITE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry
        if: env.CAN_WRITE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: |
            type=registry,ref=${{ env.CACHE_PR }}
            type=registry,ref=${{ env.CACHE_MAIN }}
          cache-to: ${{ env.CAN_WRITE == 'true' && format('type=registry,ref={0},mode=max,image-manifest=true,oci-mediatypes=true', env.CACHE_PR) || '' }}
